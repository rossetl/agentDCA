[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdca"
version = "0.1.2"
description = "MCP server and agent plugin for adabmDCA"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lorenzo Rosset" }]
dependencies = [
  "adabmDCA @ git+https://github.com/spqb/adabmDCApy.git@agent-api",
  "mcp>=2,<3",
  "numpy>=1.24",
]

[project.scripts]
agentdca-mcp = "agentdca.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
